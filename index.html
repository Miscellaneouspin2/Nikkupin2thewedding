<script>
document.addEventListener('DOMContentLoaded', function () {
  const splash = document.getElementById('splash-screen');
  const bg = document.getElementById('bg-music');

  // Create a small accessible Play/Pause control (hidden by default).
  const musicCtl = document.createElement('button');
  musicCtl.id = 'music-control';
  musicCtl.type = 'button';
  musicCtl.setAttribute('aria-pressed', 'false');
  musicCtl.textContent = 'Play music';
  musicCtl.style.display = 'none';
  musicCtl.style.position = 'fixed';
  musicCtl.style.bottom = '92px';
  musicCtl.style.right = '14px';
  musicCtl.style.zIndex = 1200;
  musicCtl.style.padding = '10px 12px';
  musicCtl.style.borderRadius = '12px';
  musicCtl.style.background = 'rgba(243,208,120,.12)';
  musicCtl.style.color = '#f3d078';
  musicCtl.style.border = '1px solid rgba(243,208,120,.25)';
  musicCtl.style.cursor = 'pointer';

  document.body.appendChild(musicCtl);

  function updateButtonState() {
    if (!bg) return;
    if (!bg.paused) {
      musicCtl.textContent = 'Pause music';
      musicCtl.setAttribute('aria-pressed', 'true');
    } else {
      musicCtl.textContent = 'Play music';
      musicCtl.setAttribute('aria-pressed', 'false');
    }
  }

  musicCtl.addEventListener('click', async function () {
    if (!bg) return;
    try {
      if (bg.paused) {
        await bg.play();
      } else {
        bg.pause();
      }
    } catch (e) {
      console.warn('Playback failed:', e);
    }
    updateButtonState();
  });

  function openInvitationAndTryPlay() {
    if (splash) splash.classList.add('opened');
    document.documentElement.classList.add('page-ready');
    if (!bg) return;
    bg.play().then(() => {
      musicCtl.style.display = 'none';
      updateButtonState();
    }).catch((err) => {
      musicCtl.style.display = 'inline-block';
      console.warn('Autoplay blocked; showing play/pause button.', err);
    });
  }

  if (splash) {
    splash.addEventListener('click', openInvitationAndTryPlay);
    splash.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') openInvitationAndTryPlay();
    });
  }

  if (bg) {
    bg.addEventListener('play', updateButtonState);
    bg.addEventListener('pause', updateButtonState);
  }
});
</script>
