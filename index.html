        /* Step 3: Luxury Swipe Carousel for 10 Images */
        .gallery-grid-10 {
            display: flex;
            grid-template-columns: none;
            gap: 16px;
            margin-top: 15px;
            padding: 4px 8% 18px 0;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-padding-left: 0;
            overscroll-behavior-inline: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .gallery-grid-10::-webkit-scrollbar { display: none; }
        .gallery-grid-10 img {
            flex: 0 0 88%;
            width: 88%;
            height: clamp(430px, 112vw, 610px);

            border-radius: 30px;
            border: 1px solid rgba(255,255,255,.45);
            box-shadow: 0 18px 45px rgba(0,0,0,.58), inset 0 0 0 1px rgba(243,208,120,.12);
            cursor: pointer;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: linear-gradient(145deg,#242428,#08080a);
        }
        .gallery-grid-10 img:focus-visible {
            outline: 2px solid var(--gold-primary);
            outline-offset: 4px;
        }
 
        .form-control {
            width: 100%;
            background: rgba(20, 20, 25, 0.7);
            border: 1px solid var(--gold-border);
            border-radius: 14px;
            padding: 14px 18px;
            color: white;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;

        .form-control:focus {
            border-color: var(--gold-primary);
        }

            bottom: 20px;

            border-radius: 50px;

            align-items: center;

        .nav-btn {

<!-- V17.4: One Razorpay Payment Page for both bride and groom Shagun selections. -->
<script id="v174-razorpay-shagun">
(function(){
  'use strict';
  const SHAGUN_PAYMENT_URL = 'https://razorpay.me/@Shunya';
  window.SHAGUN_PAYMENT_URL = SHAGUN_PAYMENT_URL;

  function controlText(el){
    return (el && (el.textContent || el.value || el.getAttribute('aria-label') || ''))
      .replace(/\s+/g,' ').trim();
  }
  function isShagunPaymentControl(el){
    if(!el) return false;
    const text=controlText(el);
    return el.id==='shagunPayButton' || el.id==='upiPayButton' || el.id==='shagunSubmit' ||
      el.matches('[data-shagun-pay],[data-upi-pay]') ||
      /UPI\s*(?:ऐप|app)\s*से\s*(?:शगुन|Shagun)\s*भेजें/i.test(text);
  }
  function applyPaymentLink(control){
    if(!isShagunPaymentControl(control)) return;
    control.setAttribute('data-shagun-pay','razorpay');
    control.setAttribute('aria-label','Razorpay पर शगुन भेजें');
    if(control.tagName==='A'){
      control.href=SHAGUN_PAYMENT_URL;
      control.target='_blank';
      control.rel='noopener noreferrer';
    }
  }
  function configureControls(root){
    const scope=root && root.querySelectorAll ? root : document;
    scope.querySelectorAll('button,a,[role="button"],input[type="button"],input[type="submit"]').forEach(applyPaymentLink);
  }
  function openRazorpay(){
    const win=window.open(SHAGUN_PAYMENT_URL,'_blank','noopener,noreferrer');
    if(!win) window.location.assign(SHAGUN_PAYMENT_URL);
  }
  document.addEventListener('click',function(event){
    const control=event.target.closest('button,a,[role="button"],input[type="button"],input[type="submit"]');
    if(!isShagunPaymentControl(control)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    openRazorpay();
  },true);
  document.readyState==='loading' ? document.addEventListener('DOMContentLoaded',function(){configureControls(document)},{once:true}) : configureControls(document);
  new MutationObserver(function(mutations){
    mutations.forEach(function(m){m.addedNodes.forEach(function(node){if(node.nodeType===1){applyPaymentLink(node);configureControls(node)}})});
  }).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
