<script>
// Small script to allow admin preview to start/pause music via a visible button if autoplay is blocked
(function(){
  try{
    const bg=document.getElementById('bg-music');
    if(!bg) return;
    const ctl=document.createElement('button');
    ctl.id='admin-music-control';
    ctl.textContent='Play music';
    ctl.style.position='fixed';ctl.style.bottom='18px';ctl.style.right='18px';ctl.style.zIndex='9999';
    ctl.style.padding='10px 12px';ctl.style.borderRadius='12px';ctl.style.background='rgba(243,208,120,.12)';ctl.style.color='#f3d078';ctl.style.border='1px solid rgba(243,208,120,.25)';
    document.body.appendChild(ctl);
    function update(){ctl.textContent = bg.paused ? 'Play music' : 'Pause music';}
    ctl.addEventListener('click', async ()=>{ try{ if(bg.paused) await bg.play(); else bg.pause(); update(); }catch(e){console.warn(e);} });
    bg.addEventListener('play', update); bg.addEventListener('pause', update);
    // try autoplay once (for convenience)
    bg.play().catch(()=>{ /* ignore */ });
  }catch(e){console.warn(e)}
})();
</script>
